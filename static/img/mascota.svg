<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Dr. Juaco, abogado de Derechos On">
  <defs>
    <linearGradient id="piel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdbb6"/>
      <stop offset="1" stop-color="#eda76c"/>
    </linearGradient>
    <linearGradient id="traje" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4a7f"/>
      <stop offset="1" stop-color="#14294b"/>
    </linearGradient>
    <linearGradient id="corbata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58cc02"/>
      <stop offset="1" stop-color="#33a505"/>
