      keyTimes="0;.25;.5;.75;1" dur="4s" repeatCount="indefinite"/>
    <rect x="46.5" y="98" width="10" height="15" rx="5" fill="#1f3054"/>
    <ellipse cx="51" cy="113.5" rx="7.6" ry="3.6" fill="#0f1829"/>
  </g>
  <g class="pierna-izq">
    <animateTransform attributeName="transform" type="rotate"
      values="0 69 99;-2 69 99;0 69 99;2.6 69 99;0 69 99"
      keyTimes="0;.25;.5;.75;1" dur="4s" repeatCount="indefinite"/>
    <rect x="63.5" y="98" width="10" height="15" rx="5" fill="#1f3054"/>
    <ellipse cx="69" cy="113.5" rx="7.6" ry="3.6" fill="#0f1829"/>
  </g>

