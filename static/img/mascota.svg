    <circle cx="90" cy="57" r="5.6" fill="url(#piel)"/>
    <circle cx="93.4" cy="54" r="1.7" fill="url(#piel)"/>
    <circle cx="95" cy="57.4" r="1.7" fill="url(#piel)"/>
    <circle cx="93.6" cy="60.8" r="1.7" fill="url(#piel)"/>
