    </g>
    <path d="M-5.8 0 Q0 -2.7 5.8 0" stroke="#7a3d22" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Párpados animados (parpadeo) -->
  <g class="parp">
    <circle cx="46.5" cy="47" r="10.8" fill="url(#piel)">
      <animate attributeName="opacity"
