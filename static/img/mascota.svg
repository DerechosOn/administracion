  <path d="M47 98 C45.5 86 50 76 58 71.5 L60 74 C55 80 52 90 52 98 Z" fill="#1f3a66" opacity=".45"/>
  <path d="M44 98 C40 84 46 72 58 68 Q48 78 46 90 Q45 96 45 100 Z" fill="#ffffff" opacity=".09"/>

  <!-- Brazo derecho en saludo (animado) -->
  <g class="brazo-saludo">
