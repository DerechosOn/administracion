# Nginx: reverso proxy para Derechos On (Gunicorn en 127.0.0.1:8000)
# Instala con Certbot para HTTPS: certbot --nginx -d derechoson.online -d www.derechoson.online

server {
    listen 80;
    listen [::]:80;
    server_name derechoson.online www.derechoson.online;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos estáticos servidos de forma directa (rendimiento)
    location /static/ {
        alias /home/derechoson/derechos-on/static/;
        access_log off;
        expires 7d;
    }
}